[project]
name = "devpilot"
version = "1.0.0"
description = "Multi-agent software engineering automation platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "loguru>=0.7.3",
    "matplotlib>=3.11.2",
    "mcp>=2.2.0",
    "numpy>=2.5.3",
    "openai>=3.6.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "rank-bm25>=0.2.2",
    "scipy>=1.18.1",
    "sentence-transformers>=6.0.1",
    "torch>=2.14.0",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
addopts = "-q"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

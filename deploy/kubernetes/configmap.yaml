# 示例清单，需按集群实际调整。
# REDIS_URL 与 DOCKER_HOST 均为占位值，部署前替换为真实地址。
apiVersion: v1
kind: ConfigMap
metadata:
  name: devpilot-config
  namespace: devpilot
data:
  APP_ENV: "production"
  LOG_LEVEL: "INFO"
  TASK_QUEUE_BACKEND: "redis"
  DATABASE_BACKEND: "mysql"
  ALLOWED_REPO_ROOTS: "/workspace"
  TASK_QUEUE_MAX_DEPTH: "100"
  TASK_WORKER_MAX_CONCURRENCY: "2"
  REDIS_URL: "redis://redis-host:6379/0"
  # 远端 daemon 的 TLS 与证书挂载需按实际集群补充。
  DOCKER_HOST: "tcp://docker-host.local:2376"

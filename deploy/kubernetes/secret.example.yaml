# 仅为模板：替换占位值后在受控环境创建，真实密钥文件不得提交。
apiVersion: v1
kind: Secret
metadata:
  name: devpilot-secrets
  namespace: devpilot
type: Opaque
stringData:
  API_KEYS: "replace-with-random-api-key"
  MYSQL_URL: "mysql://devpilot:replace-password@mysql-host:3306/devpilot"
  LLM_API_KEY: "replace-with-provider-key"
  LLM_MODEL: "replace-with-model-name"

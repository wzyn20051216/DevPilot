services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: production
      DATABASE_PATH: /app/backend/data/devpilot.db
      WORKSPACE_ROOT: /workspace
      HOST_WORKSPACE_ROOT: ${DEVPILOT_HOST_WORKSPACE_ROOT}
    volumes:
      - devpilot_data:/app/backend/data
      - ${DEVPILOT_HOST_WORKSPACE_ROOT}:/workspace
      # 仅用于本地开发/答辩 Demo，不是互联网生产部署方案。
      - /var/run/docker.sock:/var/run/docker.sock
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz')"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # API/Worker 分离：Worker 独立进程经任务队列领取并执行任务。
  # 仅按需启动（docker compose --profile worker up）。
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: python -m backend.src.worker
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: production
      DATABASE_PATH: /app/backend/data/devpilot.db
      WORKSPACE_ROOT: /workspace
      HOST_WORKSPACE_ROOT: ${DEVPILOT_HOST_WORKSPACE_ROOT}
    volumes:
      - devpilot_data:/app/backend/data
      - ${DEVPILOT_HOST_WORKSPACE_ROOT}:/workspace
      # Worker 负责运行 Sandbox，需要访问宿主机 Docker daemon。
      - /var/run/docker.sock:/var/run/docker.sock
    profiles: ["worker"]
    restart: unless-stopped

  # 按需启动存储服务；API/Worker 的连接串统一写入 backend/.env。
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DEVPILOT_MYSQL_ROOT_PASSWORD:-}
      MYSQL_DATABASE: devpilot
      MYSQL_USER: devpilot
      MYSQL_PASSWORD: ${DEVPILOT_MYSQL_PASSWORD:-}
    volumes:
      - devpilot_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    profiles: ["mysql"]
    restart: unless-stopped

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - devpilot_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    profiles: ["redis"]
    restart: unless-stopped

volumes:
  # SQLite 使用 Docker 管理的 Linux 文件系统，避免 Windows bind mount 锁冲突。
  devpilot_data:
  devpilot_mysql:
  devpilot_redis:
